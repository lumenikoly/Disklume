<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>ClearMap</title>
  <link rel="icon" href="./mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app/main.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><img src="./mark.svg" alt="" width="28" height="28"><span>ClearMap</span></div>
      <div class="top-spacer"></div>
      <button id="choose-folder" class="secondary" title="Выбрать папку (Ctrl / ⌘ + O)"><span data-icon="folder"></span><span id="folder-name">Выбрать папку</span><span class="folder-arrow">⌄</span></button>
      <button class="icon-button" id="rescan" disabled title="Сканировать заново" aria-label="Сканировать заново"><span data-icon="refresh"></span></button>
      <button class="language-button" id="language" title="English / Русский" aria-label="English / Русский">EN</button>
    </header>
    <main id="welcome" class="welcome">
      <div class="welcome-art" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <h1>Что занимает место?</h1>
      <p>Выберите папку. Крупное станет заметным.</p>
      <button class="primary" id="welcome-choose"><span data-icon="folder"></span>Выбрать папку</button>
    </main>
    <main id="workspace" hidden>
      <div class="navigation">
        <div class="history-controls" aria-label="Навигация"><button id="nav-back" class="icon-button" title="Назад (Alt + ←)" aria-label="Назад" disabled><span data-icon="back"></span></button><button id="nav-forward" class="icon-button" title="Вперёд (Alt + →)" aria-label="Вперёд" disabled><span data-icon="forward"></span></button><button id="nav-up" class="icon-button" title="На уровень выше (Alt + ↑)" aria-label="На уровень выше" disabled><span data-icon="up"></span></button></div><nav id="breadcrumbs" class="breadcrumbs" aria-label="Путь"></nav>
        <label class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="Найти файл…" aria-label="Поиск по имени или пути" maxlength="1024" autocomplete="off"><button id="clear-search" class="icon-button" aria-label="Очистить поиск" hidden>×</button></label>
      </div>
      <section class="summary">
        <div><p class="eyebrow" id="size-label">ЗАНЯТО В ПАПКЕ</p><h1 id="current-size" title="Размер на диске — оценка">—</h1><p id="view-count"></p></div>
        <span class="map-caption">Больше площадь — больше размер</span>
      </section>
      <section class="explorer" aria-label="Содержимое папки">
        <div class="map-panel"><div id="treemap" class="treemap" aria-label="Карта размеров" role="group"></div><div id="empty-state" class="map-empty" hidden><span data-icon="folder"></span><p id="empty-message"></p></div><div id="zero-state" class="map-empty" hidden><p>Файлы не занимают места на карте</p></div></div>
        <div class="list-panel"><div class="list-heading"><h2>Папки и файлы</h2><span>По размеру</span></div><div id="file-list" class="file-list"></div><aside id="inspector" class="inspector" aria-label="Выбранные файлы" hidden></aside></div>
      </section>
      <section class="actionbar" id="actionbar" hidden><span data-icon="trash"></span><span id="plan-count"></span><div class="top-spacer"></div><button class="text-button" id="plan-clear">Сбросить</button><button class="primary" id="review-open">Проверить и удалить</button></section>
      <footer class="statusbar"><div class="status-left"><span id="status-indicator" class="status-dot"></span><span id="status-text">Готово</span><button id="cancel-job" class="text-button" hidden>Остановить</button><button id="show-issues" class="text-button" hidden></button></div><span id="folder-path" class="folder-path"></span><span id="total-count" hidden></span></footer>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden><span id="toast-message"></span><button id="toast-close" class="icon-button" aria-label="Закрыть уведомление">×</button></div>
  <div id="context-menu" class="context-menu" role="menu" hidden></div>
  <dialog id="review" class="review-dialog"><div class="dialog-head"><h2>Переместить в Корзину?</h2><button id="review-close" class="icon-button" aria-label="Закрыть">×</button></div><p class="dialog-note">Перенос в Корзину не гарантирует освобождение места. Приложение её не очищает.</p><div id="review-summary" class="review-summary"></div><div id="review-files" class="review-files"></div><div id="review-pagination" class="pagination"></div><div class="dialog-actions"><div class="top-spacer"></div><button id="review-cancel" class="secondary">Отмена</button><button id="review-confirm" class="danger">Переместить в Корзину</button></div></dialog>
  <dialog id="message-dialog" class="message-dialog"><div class="dialog-head"><h2 id="message-title"></h2><button id="message-close" class="icon-button" aria-label="Закрыть">×</button></div><div id="message-body" class="message-body"></div><div class="dialog-actions"><div class="top-spacer"></div><button id="message-cancel" class="secondary">Отмена</button><button id="message-confirm" class="primary">Понятно</button></div></dialog>
</body>
</html>
