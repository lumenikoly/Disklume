name: Release executables

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix (for example 0.0.2)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release source and version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Run releases from main." >&2; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must match X.Y.Z." >&2; exit 1; }
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test "$(node -p "require('./src-tauri/tauri.conf.json').version")" = "$VERSION"
          grep -Fxq "version = \"$VERSION\"" Cargo.toml
          test "$(grep -Fxc "# $VERSION" CHANGELOG.md)" -eq 1
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists." >&2
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            binary: target/release/clearmap.exe
          - os: macos-latest
            platform: macos
            binary: target/release/clearmap
          - os: ubuntu-24.04
            platform: linux
            binary: target/release/clearmap
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p clearmap-core --all-targets --locked
      - run: cargo test -p clearmap-core --locked
      - name: Build executable without bundle
        run: npm run tauri -- build --no-bundle -- --locked
      - name: Collect executable
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ matrix.platform }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          test -f "$BINARY"
          mkdir -p release-assets
          arch="${RUNNER_ARCH,,}"
          extension=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then extension=".exe"; fi
          cp "$BINARY" "release-assets/ClearMap_${VERSION}_${PLATFORM}_${arch}${extension}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS
      - name: Extract release notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          awk -v header="# $VERSION" '$0 == header { found=1; next } found && /^# / { exit } found { print }' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md --fail-on-no-commits
